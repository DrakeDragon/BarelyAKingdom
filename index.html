<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Barely a Kingdom</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: phone-first single column. Sticky header (realm, level ring, 5 resource chips), animated kingdom diorama above Throne/Realm, bottom nav with 5 tabs, full-screen stages for cutscenes and boss fights. Committed dark royal-plum look with gold accents, one look in both themes. */
:root{
  --bg:#150f2b; --bg2:#1d1540; --panel:#2a1f50; --panel2:#392b6b; --line:#4d3d8c; --lineS:#6a56b8;
  --fg:#f7f1ff; --muted:#b9acdc; --gold:#ffc83d; --goldL:#ffe27a; --goldD:#b97a00;
  --good:#6ee3a0; --bad:#ff7a88; --info:#86cbff; --warn:#ffb347;
  --coin:#ffc83d; --grub:#a6e86a; --lumber:#e0a56b; --subj:#ff9fcb; --vibe:#c6a9ff; --seal:#7ee2ff;
  --crown:#aeb8c2;
  --r0:#c9bfe3; --r1:#6ee3a0; --r2:#79bbff; --r3:#cb90ff; --r4:#ffb347;
  --font-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --font-epic:'Cinzel','Georgia',serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(1200px 520px at 50% -140px,#3a2a78 0,transparent 70%),var(--bg);color:var(--fg);font-family:var(--font-body);font-weight:600;font-size:15px;line-height:1.42;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button{font:inherit;color:inherit;touch-action:manipulation}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
svg{display:block}
#app{max-width:560px;margin:0 auto}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(var(--bg) 82%,rgba(21,15,43,0));padding:10px 0 10px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hrow>div{min-width:0}
.realm{font-family:var(--font-display);font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.rk{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:flex;align-items:center;gap:9px;text-align:right;flex:none}
.heroT{min-width:0;max-width:104px}
.lvl-ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),#3b2d73 0);display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.4)}
.lvl-ring span{width:35px;height:35px;border-radius:50%;background:linear-gradient(#34265f,#221a45);display:grid;place-items:center;font-family:var(--font-display);font-size:17px;color:var(--goldL)}
.lvl-ring.up{animation:lvup .8s ease-out}
@keyframes lvup{0%{transform:scale(1)}30%{transform:scale(1.35);box-shadow:0 0 0 6px rgba(255,200,61,.4)}100%{transform:scale(1)}}
.ti{font-size:11px;color:var(--muted);white-space:normal;line-height:1.15}
.hbtns{display:flex;gap:6px}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:18px;height:18px}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:9px}
.chip{background:linear-gradient(#32245f,#271c4d);border:1px solid var(--line);border-radius:12px;padding:5px 6px 4px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.chip .v{font-family:var(--font-display);font-size:13px;display:flex;align-items:center;gap:2px;line-height:1.2}
.chip .v span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip svg{width:12px;height:12px;flex:none}
.chip .r{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chip .r.neg{color:var(--bad)}
.c-coin svg{color:var(--coin)}.c-grub svg{color:var(--grub)}.c-lumber svg{color:var(--lumber)}.c-subj svg{color:var(--subj)}.c-vibe svg{color:var(--vibe)}
.mini{height:4px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,#8f6bff,#e0c8ff);width:50%;transition:width .3s}
.pill-seal{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-display);font-size:13px;color:var(--seal);background:#1c2c4c;border:1px solid #2c4a7c;border-radius:999px;padding:2px 9px;margin-top:3px}
.pill-seal svg{width:12px;height:12px}

/* ---------- Hubert bubble ---------- */
.say{display:flex;gap:10px;align-items:flex-end;margin:4px 0 12px}
.hub{width:58px;height:70px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));animation:hbob 3.4s ease-in-out infinite}
@keyframes hbob{50%{transform:translateY(-3px) rotate(-1.5deg)}}
.hub svg{width:100%;height:100%}
.bubble{position:relative;background:linear-gradient(#34275f,#2a1f50);border:1px solid var(--lineS);border-radius:6px 16px 16px 16px;padding:9px 13px;font-size:14px;min-width:0;flex:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.bubble b{color:var(--gold);font-family:var(--font-display);font-weight:400;font-size:12px;letter-spacing:.07em;text-transform:uppercase;display:block}
.bubble.bump{animation:bump .28s ease-out}
@keyframes bump{from{transform:scale(.97);opacity:.5}}

main{padding-bottom:116px}
.tab[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:linear-gradient(180deg,#322460,#271c4d);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 18px rgba(0,0,0,.2)}
.card h3{font-size:19px;margin-bottom:4px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:5px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* ---------- buttons ---------- */
.btn{font-family:var(--font-display);font-size:16px;border:0;border-radius:999px;padding:10px 20px;background:linear-gradient(#ffdc6a,#ffb21f);color:#2b1a00;cursor:pointer;box-shadow:0 3px 0 var(--goldD),inset 0 1px 0 rgba(255,255,255,.55);user-select:none;position:relative}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--goldD)}
.btn[disabled]{opacity:.38;box-shadow:none;cursor:default;transform:none;filter:saturate(.6)}
.btn.ghost{background:linear-gradient(#4a3a86,#3a2c6d);color:var(--fg);box-shadow:0 3px 0 #1d1436,inset 0 1px 0 rgba(255,255,255,.15)}
.btn.sm{font-size:14px;padding:7px 14px}
.btn.danger{background:linear-gradient(#ff8c98,#ff5d70);color:#33000a;box-shadow:0 3px 0 #a52c3b}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--goldD),0 0 0 8px rgba(255,200,61,.22)}}

/* ---------- scene ---------- */
.sceneBox{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--lineS);box-shadow:0 10px 26px rgba(0,0,0,.4);background:#1b1237;aspect-ratio:560/236;line-height:0}
#scene{width:100%;height:100%;display:block;touch-action:manipulation}
.sceneTag{position:absolute;left:10px;top:8px;font-family:var(--font-display);font-size:12px;letter-spacing:.06em;background:rgba(15,8,38,.6);backdrop-filter:blur(4px);padding:3px 10px;border-radius:999px;line-height:1.3;color:var(--goldL);pointer-events:none}
.gooseHint{position:absolute;right:10px;top:8px;font-size:11px;font-weight:800;background:rgba(255,200,61,.92);color:#2b1a00;padding:3px 9px;border-radius:999px;line-height:1.3;pointer-events:none;animation:pulse 1s infinite}

/* ---------- throne ---------- */
.quest{background:linear-gradient(135deg,#40307a,#2a1f50);border-color:var(--lineS)}
.quest .qt{font-family:var(--font-epic);font-weight:800;font-size:16px;letter-spacing:.02em;margin-bottom:2px}
.quest.ready{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 24px rgba(255,200,61,.25)}
.quest .btn{margin-top:10px}
.goal .gt{font-family:var(--font-display);font-size:17px}
.goal .gp{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
.goal .gp i{display:block;height:100%;background:linear-gradient(90deg,#4fd28d,#9bf5c4);width:0}
.decreeWrap{position:relative}
.decree{width:100%;border:0;border-radius:24px;padding:20px 12px 18px;cursor:pointer;color:#2b1a00;background:linear-gradient(#ffe27a,#ffb21f 55%,#f09a0a);box-shadow:0 7px 0 var(--goldD),0 16px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.6);user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.decree:active,.decree.pressed{transform:translateY(5px);box-shadow:0 2px 0 var(--goldD),0 8px 16px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.decree b{display:block;font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.1;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.decree span{font-size:13px;font-weight:800;opacity:.8}
.decree::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-120%);animation:shine 4s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.decree.frenzy{background:linear-gradient(#ff9ad5,#ff4fa3 55%,#d62e86);color:#fff;box-shadow:0 7px 0 #8f1a5a,0 0 36px rgba(255,79,163,.55);animation:fz .25s infinite alternate}
.decree.frenzy b{text-shadow:0 2px 0 rgba(0,0,0,.3)}
@keyframes fz{to{transform:translateY(-2px) scale(1.01)}}
.fzBar{height:8px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden;margin:9px 4px 0;position:relative}
.fzBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4fa3,#ffd0ea);transition:width .15s}
.fzLab{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);padding:3px 6px 0;letter-spacing:.06em;text-transform:uppercase}
.pop{position:absolute;pointer-events:none;font-family:var(--font-display);font-size:23px;color:#fff;text-shadow:0 2px 0 #000,0 0 8px var(--gold);animation:rise .85s ease-out forwards;white-space:nowrap;z-index:5}
.pop.crit{color:var(--gold);font-size:32px}
@keyframes rise{from{transform:translate(-50%,0) scale(.8);opacity:1}to{transform:translate(-50%,-76px) scale(1.15);opacity:0}}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{background:linear-gradient(#3a2c6d,#2a1f50);border:1px solid var(--line);border-radius:14px;padding:9px 6px 8px;cursor:pointer;text-align:center;position:relative;overflow:hidden;min-width:0}
.act b{display:block;font-family:var(--font-display);font-weight:400;font-size:14px;line-height:1.1}
.act span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.act .cdf{position:absolute;left:0;bottom:0;height:100%;background:rgba(10,5,30,.62);width:0;transition:width .3s;pointer-events:none}
.act .cdt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:17px;color:#fff;pointer-events:none}
.act:active{transform:scale(.97)}
.pet .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:linear-gradient(#41327a,#34276a);border:1px solid var(--line);border-radius:13px;padding:10px 13px;cursor:pointer;width:100%}
.choice:active{background:var(--line)}
.choice .cl{font-weight:800}
.choice .ck{font-size:12px;white-space:nowrap;color:var(--info);font-weight:800}
.fxs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fx{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:#160f30}
.fx.up{color:var(--good)}.fx.dn{color:var(--bad)}
.verdict{font-family:var(--font-display);font-size:14px;letter-spacing:.07em;text-transform:uppercase}
.verdict.w{color:var(--good)}.verdict.l{color:var(--bad)}
.gaz{display:flex;flex-direction:column;gap:6px}
.gaz div{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:9px}
.gaz div:first-child{color:var(--fg);border-color:var(--gold)}
.gaz em{font-style:normal;color:var(--gold);font-size:11px;font-weight:800;margin-right:5px}

/* ---------- realm ---------- */
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px;font-size:12px;color:var(--muted)}
.sumrow b{display:block;font-family:var(--font-display);font-weight:400;font-size:15px;color:var(--fg)}
.qty{display:flex;gap:6px;margin-top:10px}
.qty button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:7px 0;font-weight:800;cursor:pointer}
.qty button.on{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.bcard{background:linear-gradient(#322460,#271c4d);border:1px solid var(--line);border-radius:15px;padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.bcard.locked{opacity:.55;border-style:dashed}
.bcard.afford{border-color:#7a64c8;box-shadow:0 0 0 1px rgba(255,200,61,.25)}
.bt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bt b{font-family:var(--font-display);font-weight:400;font-size:17px}
.own{font-family:var(--font-display);color:var(--gold);font-size:17px;white-space:nowrap}
.beff{font-size:12px;color:var(--good);font-weight:800}
.bd{font-size:13px;color:var(--muted)}
.bb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cost{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.cost span{display:inline-flex;align-items:center;gap:3px}
.cost svg{width:13px;height:13px}
.cost .no{color:var(--bad)}

/* ---------- quests ---------- */
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5bd0ff,#86ffd2);width:0}
.region{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.regH{padding:12px 15px;position:relative}
.regH h3{font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.regH p{font-size:12px;opacity:.85}
.regH .lk{position:absolute;right:14px;top:14px;font-family:var(--font-display);font-size:13px;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:999px}
.regB{display:flex;flex-direction:column;gap:8px;padding:10px;background:#1e1542}
.qcard{background:linear-gradient(#322460,#2a1f50);border:1px solid var(--line);border-radius:13px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.qcard.locked{opacity:.5}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qtop b{font-family:var(--font-display);font-weight:400;font-size:16px}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--info);white-space:nowrap}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.stars{color:var(--gold);letter-spacing:2px;font-size:13px}
.stars i{font-style:normal;color:#4d3d8c}

/* ---------- hero ---------- */
.profile{display:flex;gap:14px;align-items:center}
.avatar{width:72px;height:90px;flex:none;border-radius:16px;background:radial-gradient(circle at 50% 30%,#4c3b94,#2a1f50);border:1px solid var(--lineS);overflow:hidden}
.avatar svg{width:100%;height:100%}
.statrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.statrow:first-of-type{border-top:0}
.statrow b{font-family:var(--font-display);font-weight:400;font-size:17px}
.statrow .sv{font-family:var(--font-display);font-size:21px;text-align:right;min-width:48px}
.statrow .sv small{font-size:12px;color:var(--good);font-family:var(--font-body);font-weight:800}
.plus{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(#ffdc6a,#ffb21f);color:#2b1a00;font-family:var(--font-display);font-size:23px;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--goldD)}
.plus[disabled]{opacity:.25;box-shadow:none}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.slot .sn{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.slot .in{font-weight:800;font-size:13px;overflow-wrap:anywhere}
.slot .ib2{font-size:12px;color:var(--good)}
.item{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding:9px 0}
.item:first-child{border-top:0}
.item .nm{font-weight:800;overflow-wrap:anywhere}
.item .rowb{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item .isub{font-size:12px;color:var(--muted)}
.item .ib2{font-size:12px;color:var(--good);font-weight:800}
.item .dlt{font-size:12px;font-weight:800}
.dlt.up{color:var(--good)}.dlt.dn{color:var(--bad)}
.r0 .nm{color:var(--r0)}.r1 .nm{color:var(--r1)}.r2 .nm{color:var(--r2)}.r3 .nm{color:var(--r3)}.r4 .nm{color:var(--r4)}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach{background:var(--bg);border-radius:11px;padding:8px 10px;opacity:.5;min-width:0}
.ach.on{opacity:1;border:1px solid var(--gold)}
.ach b{font-size:13px;display:block}
.ach span{font-size:11px;color:var(--muted)}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tgl:first-of-type{border-top:0}
.sw{width:48px;height:28px;border-radius:999px;background:#241a4a;border:1px solid var(--line);position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.sw[aria-pressed="true"]{background:#2d7a52}
.sw[aria-pressed="true"]::after{left:23px;background:#fff}
textarea.save{width:100%;min-height:70px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.3 ui-monospace,Menlo,monospace;margin-top:8px}

/* ---------- court ---------- */
.comp{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.comp.locked{opacity:.55}
.cport{width:64px;height:76px;border-radius:14px;background:radial-gradient(circle at 50% 28%,#4c3b94,#2a1f50);border:1px solid var(--lineS);overflow:hidden}
.cport svg{width:100%;height:100%}
.comp.locked .cport svg{filter:brightness(0) opacity(.5)}
.comp h3{font-size:17px}
.pips{display:flex;gap:4px;margin:3px 0 5px}
.pips i{width:16px;height:6px;border-radius:3px;background:#3a2d72}
.pips i.on{background:linear-gradient(90deg,var(--gold),var(--goldL))}
.cinfo{font-size:12px;color:var(--muted)}
.cinfo b{color:var(--fg);font-weight:800}
.cabil{font-size:12px;margin:5px 0;background:#1b1340;border-radius:10px;padding:6px 9px}
.cabil b{color:var(--gold);font-family:var(--font-display);font-weight:400}
.edict-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.eb{background:#1f1646;border:1px solid var(--line);border-radius:14px;padding:9px;display:flex;flex-direction:column;gap:7px;min-width:0}
.eb h4{margin:0;font-family:var(--font-display);font-weight:400;font-size:15px;letter-spacing:.03em}
.ed{background:#2c2058;border:1px solid var(--line);border-radius:11px;padding:7px 9px;text-align:left;cursor:pointer;width:100%;min-width:0}

{id:"lake",rk:0,t:"The Great Lake Question",x:"Pete says the puddle is a lake and wants to run boat tours. There are no tourists. His boat is a bucket.",c:[

{id:"chair",rk:0,t:"Who Stole the Throne?",x:"Somebody stole the throne. You never had a throne. It was a chair. People are very upset anyway.",c:[

{id:"bard",rk:0,t:"A Bard Wants Exposure",x:"A bard offers to sing about you in exchange for 'exposure'. He is holding a lute with one string.",c:[

{id:"cow",rk:0,t:"The Cow That Belongs to Nobody",x:"Two farmers are fighting over a cow. It belongs to neither. The cow looks tired.",c:[

{id:"purple",rk:1,t:"The Purple Tavern",x:"A wizard turned the Soggy Boot purple. It is also now singing. The tavern keeper wants it fixed. The customers want it to stay.",c:[

{id:"huberthrone",rk:1,t:"Hubert Wants a Throne",x:"Hubert, your crown, wants a tiny throne for himself. He says it's 'for dignity'. He also wants a cushion.",c:[

{id:"hat",rk:1,t:"The Definitely-Not-Cursed Hat",x:"A traveling merchant sells you a hat. 'Definitely not cursed,' he says, three times. He is sweating.",c:[

{id:"snacks",rk:1,t:"The Knights Want Snacks",x:"Your three knights demand a snack budget. They say a knight cannot fight on an empty stomach. Also they are bored.",c:[

{id:"festival",rk:2,t:"Turnip Fest or Goose Parade?",x:"The village can afford one festival this season. Half want a Turnip Fest. Half want a Goose Parade. Doug has a banner.",c:[

 {l:"Both, with one big speech",k:{s:"charm",dc:8},w:{x:"You somehow manage both. A goose rides a turnip. History is made.",fx:{vibe:12,renown:2,xp:3,coin:-0.6}},f:{x:"You tried both and did neither well. Doug is furious and honking at you.",fx:{vibe:-5,coin:-0.5}}}]},
{id:"moat",rk:2,t:"Moat or Pond?",x:"The builders want a moat. A woman named Gwen wants a pond. 'They look the same,' says one builder. Gwen disagrees, loudly.",c:[

{id:"giant",rk:2,t:"A Giant Wants an Apartment",x:"A giant named Bob wants to rent a room. The Wobbly Houses are only seven feet tall. Bob is thirty feet tall.",c:[

 {l:"Ask what to build",k:{s:"wits",dc:11},w:{x:"She draws a map in the dirt. It leads to a very good building spot. You feel lucky.",fx:{lumber:2,renown:1.5,xp:2}},f:{x:"She said something, but it hasn't happened yet. So you didn't hear it.",fx:{xp:1}}},

{id:"strike",rk:3,t:"The Wizard Strike",x:"The Tower wizards want shorter spells. Their current spells take forty minutes. A strike sign says 'TOO LONG, DIDN'T CAST'.",c:[

 {l:"Hire goose wizards",w:{x:"Doug wears a pointy hat. The wizards are insulted. They go back to work immediately.",fx:{coin:-0.3,vibe:2,xp:1}}}]},
{id:"map",rk:3,t:"The Toddler Map",x:"A neighbor claims your land with a map. The map was drawn by a toddler. It has a purple blob that says 'MINE'.",c:[

 {l:"Give them the blob",w:{x:"You give them a muddy corner that no one wanted. They feel victorious. So do you.",fx:{vibe:3,xp:1}}},

function fmt(n){
  const neg=n<0;n=Math.abs(n);let r;

}

/* ---------- derived numbers ---------- */
function derive(){
  const gb={might:0,wits:0,charm:0,grit:0,luck:0};
  for(const k in S.gear){const it=S.gear[k];if(it)for(const s in it.b)gb[s]+=it.b[s];}
  const e={};for(const k in gb)e[k]=S.st[k]+gb[k];
  const cm={doug:cl("doug"),pete:cl("pete"),gwen:cl("gwen"),brun:cl("brun"),wizzle:cl("wizzle"),barn:cl("barn"),ember:cl("ember")};
  e.might+=Math.ceil(cm.brun*1.5);e.wits+=cm.wizzle;e.luck+=ed("v4")*4;
  let c=0,g=0,l=0,rn=0,house=10,def=0,vt=38+e.charm*1.5,stam=0,loot=0,boss=0,xps=0;
  for(const b of B){
    const n=S.b[b.id]|0;if(!n)continue;const f=b.fx;
    c+=(f.coin||0)*n;g+=(f.grub||0)*n;l+=(f.lumber||0)*n;rn+=(f.renown||0)*n;
    house+=(f.house||0)*n;def+=(f.def||0)*n;vt+=(f.vibe||0)*n;
    stam+=(f.stam||0)*n;loot+=(f.loot||0)*n;boss+=(f.boss||0)*n;xps+=(f.xps||0)*n;
  }
  def+=cm.doug*3+cm.ember*4;
  vt=Math.min(95,vt+cm.pete*2+ed("c1")*6);
  const vm=0.5+S.vibe/100,lm=1+0.08*S.legacy;
  const coinMul=(1+0.1*ed("t1"))*(1+0.15*ed("t3"))*(1+0.25*ed("t4"))*(1+0.04*cm.barn);
  const coinR=(c+S.subj*0.06)*(1+0.03*e.charm)*vm*lm*coinMul;
  const grubGross=g*vm*lm*(1+0.15*ed("d1"));
  const lumR=l*vm*lm*(1+0.1*ed("d1"))*(1+0.2*ed("d2"));
  const disc=Math.min(0.6,e.wits*0.01+cm.gwen*0.02+ed("d3")*0.08+ed("d4")*0.1);
  const maxEn=8+e.grit+ed("v1")*2;
  const enRegen=(1/15)*(1+stam)*(1+0.3*ed("v2"));
  const xpMult=1+0.03*cm.wizzle;
  const defScore=def*(1+0.02*e.might)/6+e.might*0.5;
  return {gb,e,cm,house,def,vt,coinR,lumR,grubGross,grubNet:grubGross-S.subj*0.03,rnR:rn,
    disc,maxEn,enRegen,xpMult,defScore,loot,bossDmg:boss+0.15*ed("v3"),
    xpR:xps*need(S.lvl)*xpMult,
    decree:Math.max(2,(2+coinR*0.7)*(1+0.05*e.charm)*(1+0.3*ed("t2"))*(1+0.05*cm.ember)),
    crit:0.05+e.luck*0.004+cm.doug*0.01,
    offEff:ed("c3")?0.85:0.5,bondDisc:ed("c2")?0.25:0};
}
const refresh=()=>{D=derive();};
const unit=()=>({coin:Math.max(6,D.coinR*18),grub:Math.max(6,D.grubGross*14),lumber:Math.max(5,D.lumR*18)});
function ru(){const i=rankIdx();return Math.max(1,RANKS[Math.min(i+1,RANKS.length-1)].r*0.03);}
function chance(k){const v=k.s==="def"?D.defScore:D.e[k.s];return clamp(0.5+(v-k.dc)*0.07+D.e.luck*0.004,0.08,0.95);}

/* ---------- XP / effects ---------- */
function gainXP(n,quiet){
  n=n*D.xpMult;
  S.xp+=n;
  let up=0;
  while(S.xp>=need(S.lvl)){
    S.xp-=need(S.lvl);S.lvl++;S.pts+=2;up++;
    if(S.lvl%10===0){S.seals++;H.toast("A Royal Seal for reaching level "+S.lvl+"!","good");}
  }
  if(up){
    refresh();S.en=D.maxEn;
    H.levelUp(up);
    H.say("Level "+S.lvl+"! You're now a "+titleOf(S.lvl)+". I made that up. It's official now.");
    H.log("Reached level "+S.lvl+" ("+titleOf(S.lvl)+").");
  }
}
function applyFx(fx){
  const u=unit(),o=[];
  const res=(k,label)=>{
    let v=Math.round(fx[k]*u[k]);
    if(v<0)v=-Math.min(S[k],-v);
    if(v===0)return;
    S[k]+=v;if(k==="coin"&&v>0)S.earn+=v;
    o.push({v,label});
  };
  if(fx.coin)res("coin","coin");
  if(fx.grub)res("grub","grub");
  if(fx.lumber)res("lumber","lumber");
  if(fx.vibe){const before=S.vibe;S.vibe=clamp(S.vibe+fx.vibe,0,100);const v=Math.round(S.vibe-before);if(v)o.push({v,label:"vibes"});}
  if(fx.subj){
    let v=Math.round(fx.subj*Math.max(2,S.subj*0.05));
    if(v>0)v=Math.max(0,Math.min(v,Math.floor(D.house*1.1-S.subj)));else v=-Math.min(Math.floor(S.subj)-1,-v);
    if(v){S.subj+=v;o.push({v,label:"subjects"});}
  }
  if(fx.renown){const v=Math.round(fx.renown*ru()*10)/10;if(v){S.renown+=v;o.push({v,label:"renown"});}}
  if(fx.seal){S.seals+=fx.seal;o.push({v:fx.seal,label:fx.seal>1?"Royal Seals":"Royal Seal"});H.sfx("seal");}
  if(fx.stat){for(const k in fx.stat){S.st[k]+=fx.stat[k];o.push({v:fx.stat[k],label:STAT_NAMES[k]});}refresh();}
  if(fx.xp){const v=Math.max(1,Math.round(fx.xp*need(S.lvl)/12));gainXP(v);o.push({v:Math.round(v*D.xpMult),label:"XP"});}
  if(fx.xpF){const v=Math.max(1,Math.round(fx.xpF*need(S.lvl)));gainXP(v);o.push({v:Math.round(v*D.xpMult),label:"XP"});}
  if(fx.xpA){const v=Math.max(1,Math.round(fx.xpA));gainXP(v);o.push({v:Math.round(v*D.xpMult),label:"XP"});}
  if(fx.item){const it=genItem(Math.max(1,S.lvl),3);const where=addLoot(it);o.push({v:1,label:it.n+" ("+RAR[it.r]+")",raw:1});}
  return o;
}

/* ---------- economy loop ---------- */
function step(dt){
  D=derive();
  S.coin+=D.coinR*dt;S.earn+=D.coinR*dt;S.lumber+=D.lumR*dt;S.grub+=D.grubNet*dt;S.renown+=D.rnR*dt;
  if(D.xpR>0)gainXP(D.xpR*dt/D.xpMult,true);
  let hungry=false;
  if(S.grub<=0){S.grub=0;if(D.grubNet<0&&S.subj>3){hungry=true;S.starved=1;}}
  const tgt=hungry?0:D.vt;
  S.vibe=clamp(S.vibe+(tgt-S.vibe)*Math.min(1,0.05*dt)-(hungry?0.3*dt:0),0,100);
  if(!hungry&&S.subj<D.house&&S.vibe>25){
    S.subj=Math.min(D.house,S.subj+(0.05+0.012*D.e.charm)*(S.vibe/100)*(1+S.subj*0.03)*dt);
  }
  if(hungry){
    S.sT+=dt;
    if(S.sT>8){S.sT=0;const l=1+Math.floor(S.subj*0.03);S.subj=Math.max(3,S.subj-l);H.log(l+" subject"+(l>1?"s":"")+" left to find food. 'Bye,' said one. 'Good luck,' said another.");}
  }else S.sT=0;
  S.en=Math.min(D.maxEn,S.en+dt*D.enRegen);
  S.pn-=dt;
  if(S.pn<=0){S.pn=24+Math.random()*18;if(S.pq.length<3)spawnPet();}
  // frenzy meter
  if(S.frz.t>0){S.frz.t=Math.max(0,S.frz.t-dt);}else if(S.frz.m>0){S.frz.m=Math.max(0,S.frz.m-14*dt);}
  // golden goose
  S.gt-=dt;
  if(S.gt<=0){S.gt=(ed("c4")?35:65)+Math.random()*(ed("c4")?45:85);if(S.intro&&S.ch.c1)H.goose();}
  S.play+=dt;
}
function offlineSim(dt){
  const sim=Math.min(dt,8*3600)*D.offEff;
  const c0=S.coin,l0=S.lumber,s0=S.subj,x0=S.xp,lv0=S.lvl;
  let left=sim;
  const big=Math.max(1,sim/600);
  while(left>0){const d=Math.min(5*big,left);step(d);left-=d;}
  S.en=D.maxEn;
  return {coin:Math.floor(S.coin-c0),lumber:Math.floor(S.lumber-l0),subj:Math.floor(S.subj-s0),lvl:S.lvl-lv0};
}

/* ---------- petitions ---------- */
function spawnPet(){
  const r=rankIdx();
  const all=PET.concat(CPET.filter(p=>S.comp[p.need]));
  let pool=all.filter(p=>p.rk<=r&&p.rk>=r-2&&!S.pq.includes(p.id)&&p.id!==S.lastPet);
  if(!pool.length)pool=all.filter(p=>p.rk<=r&&!S.pq.includes(p.id));
  if(!pool.length)return;
  const p=pick(pool);S.pq.push(p.id);S.lastPet=p.id;
  H.toast("New petition: "+p.t);
  H.renderPet();
}
const petById=id=>PET.find(x=>x.id===id)||CPET.find(x=>x.id===id);

/* ---------- loot ---------- */
function genItem(lvl,minR){
  let r=0;const roll=Math.random()*100-D.e.luck*0.4;
  if(roll<2)r=4;else if(roll<8)r=3;else if(roll<22)r=2;else if(roll<50)r=1;
  if(minR!==undefined)r=Math.max(r,minR);
  const slot=pick(SLOTS),total=Math.max(1,Math.round((1+lvl*0.45)*RMULT[r]));
  const primary=pick(SLOTSTAT[slot]);
  const nst=r<2?1:r<4?2:3;
  const keys=[primary].concat(shuffle(["might","wits","charm","grit","luck"].filter(k=>k!==primary))).slice(0,nst);
  const b={};let left=total;
  keys.forEach((k,i)=>{
    const v=i===keys.length-1?left:Math.max(1,Math.round(total/keys.length));
    if(v>0){b[k]=(b[k]||0)+v;left-=v;}
  });
  const p=Object.values(b).reduce((a,x)=>a+x,0);
  if(r>=3)S.epic=1;
  return {id:uid(),n:pick(PRE[r])+" "+pick(BASE[slot])+(r>=1?" "+pick(SUF):""),s:slot,r,l:lvl,b,p};
}
const sellVal=it=>Math.max(1,Math.round(it.p*(6+it.l*4)*Math.max(1,D.coinR/6)));
const itemStats=it=>Object.keys(it.b).map(k=>"+"+it.b[k]+" "+STAT_NAMES[k]).join(" ");
function addLoot(it){
  const cur=S.gear[it.s];
  if(!cur){S.gear[it.s]=it;refresh();return "equipped";}
  if(S.bag.length>=30){const v=sellVal(it);S.coin+=v;return "sold";}
  S.bag.push(it);return "bag";
}

/* ---------- quests ---------- */
const questXp=q=>Math.round(4*Math.pow(q.l+1,1.4));
const stars=id=>{const w=S.qw[id]|0;return w>=30?3:w>=10?2:w>=3?1:0;};
function questRun(id){
  const q=Q.find(x=>x.id===id);if(!q||S.lvl<q.l||S.en<q.e)return null;
  S.en-=q.e;
  const ok=Math.random()<chance({s:q.s,dc:q.dc});
  let o,loot=null;
  if(ok){
    S.won++;S.qw[id]=(S.qw[id]|0)+1;
    o=applyFx({coin:1+q.l*0.1,renown:0.5+q.l*0.04,xpA:questXp(q)*(1+0.1*stars(id))});
    if(Math.random()<0.22+D.e.luck*0.004+D.loot/100){
      const it=genItem(q.l),where=addLoot(it);loot={it,where};
    }
  }else{
    S.lost++;
    o=applyFx({coin:-0.3,vibe:-2,xpA:Math.max(1,Math.round(questXp(q)*0.3))});
  }
  refresh();
  return {q,ok,o,loot,x:ok?q.w:q.f};
}

/* ---------- companions ---------- */
function joinComp(id){
  if(S.comp[id])return;
  S.comp[id]=(id==="barn"&&S.flags.barn==="friend")?2:1;
  refresh();
  H.sfx("gift");H.toast((COMP[id].n)+" joined your court!","good");
  H.log(COMP[id].n+" joined the court.");
}
function bondCost(id){
  const l=cl(id);if(!l||l>=5)return null;
  const u=unit(),f=1-D.bondDisc,c=COMP[id];
  const cost={coin:Math.ceil(u.coin*[0,6,16,40,90][l]*f)};
  cost[c.like]=Math.ceil(u[c.like]*[0,5,14,36,80][l]*f)+(c.like==="coin"?cost.coin:0);
  if(c.like==="coin"){cost.coin=Math.ceil(u.coin*[0,6,16,40,90][l]*f*1.6);}
  return cost;
}
function bondUp(id){
  const c=bondCost(id);if(!c)return false;
  for(const k in c)if(S[k]<c[k])return false;
  for(const k in c)S[k]-=c[k];
  S.comp[id]++;S.bonds++;refresh();
  return BOND_LINES[id][S.comp[id]-2];
}

/* ---------- edicts ---------- */
function edictBuy(id){
  const e=EDICTS.find(x=>x.id===id);if(!e||S.ed[id]||S.seals<e.cost)return false;
  if(e.req&&!S.ed[e.req])return false;
  S.seals-=e.cost;S.ed[id]=1;refresh();return true;
}

/* ---------- royal actions ---------- */
const cdLeft=id=>Math.max(0,(S.cd[id]||0)-S.play);
function doAction(id){
  const a=ACTIONS.find(x=>x.id===id);if(!a||cdLeft(id)>0)return null;
  const u=unit();let o=[];
  if(id==="feast"){
    const cost=Math.ceil(u.grub*5);if(S.grub<cost)return {err:"Not enough grub for a feast. Need "+fmt(cost)+"."};
    S.grub-=cost;o=applyFx({vibe:20,xpF:0.05,renown:0.3});o.unshift({v:-cost,label:"grub"});
  }else if(id==="tax"){const v=Math.floor(Math.max(u.coin*0.6,D.coinR*90));S.coin+=v;S.earn+=v;o=[{v,label:"coin"}];}
  else{const v=Math.floor(Math.max(u.lumber*0.6,D.lumR*90));S.lumber+=v;o=[{v,label:"lumber"}];}
  S.cd[id]=S.play+a.cd;
  return {a,o};
}

/* ---------- decree + frenzy ---------- */
function doDecree(){
  const f=S.frz,fr=f.t>0;
  const crit=Math.random()<D.crit;
  let mult=(crit?5:1)*(fr?3:1);
  const v=Math.round(D.decree*mult);
  S.coin+=v;S.earn+=v;S.tapped++;
  gainXP(need(S.lvl)/(120+S.lvl*10)*(fr?2:1),true);
  let started=false;
  if(!fr){f.m=Math.min(100,f.m+5);if(f.m>=100){f.m=0;f.t=8;S.frenzies++;started=true;}}
  return {v,crit,fr,started};
}

/* ---------- golden goose rewards ---------- */
function gooseReward(){
  S.geese++;
  const u=unit(),r=Math.random();
  if(r<0.3){const v=Math.floor(Math.max(u.coin*1.2,D.coinR*180));S.coin+=v;S.earn+=v;return "+"+fmt(v)+" coin";}
  if(r<0.5){S.frz.t=12;S.frz.m=0;S.frenzies++;return "Decree Frenzy!";}
  if(r<0.65){const o=applyFx({xpF:0.2});return "+"+fmt(o[0]?o[0].v:0)+" XP";}
  if(r<0.8){const v=Math.floor(Math.max(u.lumber,D.lumR*150));S.lumber+=v;return "+"+fmt(v)+" lumber";}
  if(r<0.92){const v=Math.floor(Math.max(u.grub,D.grubGross*150));S.grub+=v;return "+"+fmt(v)+" grub";}
  S.vibe=clamp(S.vibe+30,0,100);return "Vibes surge!";
}

function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dailyPending(){

/* ---------- boss fights ---------- */
const bossHP=L=>70+30*L+0.9*L*L,bossAtk=L=>13+6*L;
function fightInit(bid){
  const B0=BOSSES[bid];
  const mods=(bid==="troll"&&S.flags.trollTalk?0.8:bid==="dragon"&&S.flags.dragonTalk?0.75:1);
  const pmax=Math.round(50+9*D.e.grit+7*S.lvl);
  const bmax=Math.round(bossHP(B0.lvl)*B0.hp*mods);
  const F={id:bid,turn:1,php:pmax,pmax,bhp:bmax,bmax,b:{insp:0,conf:0,wk:0,stun:0,block:0,full:0,bweak:0},cd:{},ev:[],over:0,phase:0,
    pity:Math.min(5,S.bossFail)*0.08,intent:null,last:null,vibe:S.vibe};
  F.intent=pickIntent(F);
  return F;
}
function bossMoves(F){
  const B0=BOSSES[F.id];
  return B0.phases?B0.phases[F.phase].moves:B0.moves;
}
function pickIntent(F){
  const mv=bossMoves(F),B0=BOSSES[F.id];
  let pool=mv.filter(m=>m!==F.last);
  const m=pick(pool);
  F.last=m;
  const dmg=m.d?Math.round(bossAtk(B0.lvl)*B0.atk*m.d*(1-redOf())):0;
  return {m,dmg};
}
function redOf(){return clamp(D.defScore/(D.defScore+60)*0.35,0,0.35);}
function pdmg(F,kind){
  const e=D.e,l=S.lvl;
  let base=kind==="strike"?8+2.6*e.might+1.5*l:5+1.9*e.wits+1.1*l;
  base*=0.9+Math.random()*0.2;
  let m=(1+D.bossDmg+F.pity)*(0.8+F.vibe/250);
  if(F.b.insp>0)m*=1.3;
  if(F.b.wk>0)m*=0.7;
  const crit=Math.random()<clamp(0.08+e.luck*0.006,0,0.5);
  return {v:Math.max(1,Math.round(base*m*(crit?1.75:1))),crit,base:base*m};
}
function ev(F,t,cls,extra){F.ev.push(Object.assign({t,cls,ph:F.php,bh:F.bhp},extra||{}));}
const abMult=id=>0.85+0.15*cl(id);
function fightAct(F,act){
  if(F.over)return;
  const e=D.e;let dealt=0;
  const B0=BOSSES[F.id];
  const hit=(d,label)=>{F.bhp=Math.max(0,F.bhp-d.v);dealt+=d.v;ev(F,label+(d.crit?" A critical hit!":""),"pd",{n:d.v,to:"boss",crit:d.crit});};
  switch(act){
    case"strike":{const d=pdmg(F,"strike");hit(d,"You strike for "+d.v+".");break;}
    case"outwit":{const d=pdmg(F,"outwit");hit(d,"You outwit for "+d.v+".");F.b.conf=1;ev(F,"The boss is confused. Its next attack is weaker.","info");break;}
    case"inspire":{
      const h=Math.round(10+2.4*e.charm+1.8*S.lvl);const before=F.php;F.php=Math.min(F.pmax,F.php+h);
      F.b.insp=2;ev(F,"You inspire yourself and heal "+(F.php-before)+". Damage up for 2 turns.","heal",{n:F.php-before,to:"you"});
      if(F.id==="quill"){const d=pdmg(F,"strike");d.v=Math.round(d.v*0.6);F.bhp=Math.max(0,F.bhp-d.v);dealt+=d.v;ev(F,"Quill flinches at the joy. "+d.v+" damage.","pd",{n:d.v,to:"boss"});}
      break;}
    case"brace":{const h=Math.round(5+1.5*e.grit);const before=F.php;F.php=Math.min(F.pmax,F.php+h);F.b.block=1;ev(F,"You brace. Next hit is much weaker. Healed "+(F.php-before)+".","heal",{n:F.php-before,to:"you"});break;}
    default:{
      const id=act.replace("ab:","");const c=COMP[id];if(!c||!cl(id)||(F.cd[id]|0)>0)return;
      F.cd[id]=c.ab.cd+1;const m=abMult(id);
      if(id==="doug"){F.b.stun=1;const d=pdmg(F,"strike");d.v=Math.round(d.v*0.5);F.bhp=Math.max(0,F.bhp-d.v);dealt+=d.v;ev(F,"HONK! The boss is stunned. Doug bites for "+d.v+".","pd",{n:d.v,to:"boss"});}
      else if(id==="pete"){const h=Math.round(F.pmax*0.3*m);const b0=F.php;F.php=Math.min(F.pmax,F.php+h);ev(F,"Pete splashes you with hope. Healed "+(F.php-b0)+".","heal",{n:F.php-b0,to:"you"});}
      else if(id==="gwen"){F.b.full=1;ev(F,"Gwen builds a barricade. The next hit is blocked.","info");}
      else if(id==="brun"){const d=pdmg(F,"strike");d.v=Math.round(d.v*3.2*m);F.bhp=Math.max(0,F.bhp-d.v);dealt+=d.v;ev(F,"MONDAY SMASH! "+d.v+" damage.","pd",{n:d.v,to:"boss",crit:true});}
      else if(id==="wizzle"){const d=pdmg(F,"outwit");d.v=Math.round(d.v*2*m);F.bhp=Math.max(0,F.bhp-d.v);dealt+=d.v;F.b.bweak=2;ev(F,"Wizzle casts a three-word spell. "+d.v+" damage, and the boss is weakened.","pd",{n:d.v,to:"boss"});}
      else if(id==="barn"){const h=Math.round(F.pmax*0.2*m);const b0=F.php;F.php=Math.min(F.pmax,F.php+h);F.b.insp=3;ev(F,"Barnabus hands you a Sandwich of Courage. Healed "+(F.php-b0)+". Damage up.","heal",{n:F.php-b0,to:"you"});}
      else if(id==="ember"){const d=pdmg(F,"strike");d.v=Math.round(d.v*4*m);F.bhp=Math.max(0,F.bhp-d.v);dealt+=d.v;ev(F,"Embergrump gives a Warm Hug. "+d.v+" fire damage!","pd",{n:d.v,to:"boss",crit:true});}
    }
  }
  if(F.bhp<=0){F.over=1;F.won=true;return;}
  // phase shift
  if(B0.phases&&F.phase===0&&F.bhp/F.bmax<=B0.phases[0].until){F.phase=1;ev(F,B0.n.split(" ").pop()+"'s form shifts! She means it now.","warn");F.intent=pickIntent(F);F.intent.shift=1;}
  // boss turn
  const it=F.intent,m=it.m;
  if(F.b.stun>0){F.b.stun--;ev(F,B0.n+" is stunned and loses its turn.","info");}
  else{
    ev(F,m.say,"bd-say");
    if(m.k==="heal"){const h=Math.round(F.bmax*(m.heal||0.1));F.bhp=Math.min(F.bmax,F.bhp+h);ev(F,B0.n.split(" ")[0]+" recovers "+h+" HP.","bheal",{n:h,to:"boss"});}
    if(m.d>0){
      let d=bossAtk(B0.lvl)*B0.atk*m.d*(0.92+Math.random()*0.16);
      if(F.b.conf>0)d*=0.6;
      if(F.b.bweak>0)d*=0.6;
      d*=1-redOf();
      if(F.b.block>0)d*=0.35;
      if(F.b.full>0)d=0;
      if(d>0&&Math.random()<clamp(D.e.luck*0.004,0,0.25)){ev(F,"You dodge it!","info");d=0;}
      d=Math.round(d);
      if(d>0){F.php=Math.max(0,F.php-d);ev(F,"You take "+d+" damage.","bd",{n:d,to:"you"});}
      else if(F.b.full>0)ev(F,"The barricade holds!","info");
      if(m.debuff==="weak"){F.b.wk=2;ev(F,"You feel weak. Your damage is down for 2 turns.","warn");}
    }
  }
  F.b.conf=0;F.b.block=0;F.b.full=0;
  if(F.b.insp>0)F.b.insp--;if(F.b.wk>0)F.b.wk--;if(F.b.bweak>0)F.b.bweak--;
  for(const k in F.cd)if(F.cd[k]>0)F.cd[k]--;
  if(F.php<=0){F.over=1;F.won=false;return;}
  F.turn++;
  if(!F.intent.shift||true)F.intent=pickIntent(F);
}
function fightFinish(F){
  if(F.won){S.bosses[F.id]=1;S.bossFail=0;S.bossTries++;}
  else{S.bossFail++;S.bossTries++;applyFx({xpF:0.04});}
}

/* ---------- periodic checks ---------- */
function checkProgress(){
  const r=rankIdx();
  if(r>S.rk){
    for(let i=S.rk+1;i<=r;i++)S.seals++;
    S.rk=r;refresh();
    H.rankUp(r);
    H.say(Q_RANK[r]);
    H.log("Promoted to "+RANKS[r].n+".");
  }
  const g=GOALS[S.goal];
  if(g&&g.ck()){

/* ---------- buildings ---------- */
function bcost(b,q){
  const n=S.b[b.id]|0,g=b.g,f=(Math.pow(g,q)-1)/(g-1),m=Math.pow(g,n)*f*(1-D.disc),r={};
  for(const k in b.c)r[k]=Math.ceil(b.c[k]*m);
  return r;
}
const afford=c=>{for(const k in c)if(S[k]<c[k])return false;return true;};
function qFor(b){
  if(S.qty!=="max")return S.qty;
  let q=0;while(q<500){if(!afford(bcost(b,q+1)))break;q++;}
  return Math.max(1,q);
}
function buyB(id){
  const b=B.find(x=>x.id===id);if(!b)return null;
  const q=qFor(b),c=bcost(b,q);
  if(!afford(c))return null;
  for(const k in c)S[k]-=c[k];
  S.b[id]=(S.b[id]|0)+q;
  S.renown+=b.rn*q;
  refresh();
  return {b,q};
}

/* ---------- abdication ---------- */
function abdicate(){
  const gain=Math.max(1,Math.floor(Math.sqrt(S.renown/3000)));
  const keep={hero:S.hero,realm:S.realm,legacy:S.legacy+gain,dynasty:S.dynasty+1,ach:S.ach,earn:S.earn,play:S.play,intro:1,starved:S.starved,epic:S.epic,qty:S.qty,
    ch:S.ch,flags:S.flags,comp:S.comp,bonds:S.bonds,ed:S.ed,seals:S.seals,bosses:S.bosses,qw:S.qw,set:S.set,ending:S.ending,daily:S.daily,geese:S.geese,frenzies:S.frenzies,goal:Math.min(S.goal,GOALS.length)};
  const f=fresh();Object.assign(f,keep);f.coin=12+60*f.legacy;f.pn=10;f.goal=GOALS.length;
  S=f;refresh();save();return gain;
}

{id:"c11",act:4,title:"What Hubert Remembers",bg:"night",
 req:()=>rankIdx()>=5&&S.ch.c10,reqText:"Reach Kingdom rank",

  L("hubert","d","Psst. {n}. I remembered something."),
  L("hubert","d","I’m not tin."),
  L("me","s","You’re... not?"),
  L("hubert","d","I’m the Crown of Everything. A long time ago I could make things. People. Songs. Weather. Reginald hid me inside a tin disguise so Quill wouldn’t find me."),
  L("hubert","d","Quill used to be my keeper. She loved me. Then she decided everything had to add up. And what didn’t add up didn’t get to exist."),
  L("me","w","Why are you telling me now?"),
  L("hubert","w","Because we’re a real kingdom now. She’s coming. And I’m scared. I’m a very old, very shiny, very scared hat."),
  {ch:[
    {l:"You’re not a hat. You’re my friend.",set:{hubert:"friend"},fx:{vibe:15},n:[
      L("hubert","d","...I... thank you."),
      L("hubert","h","Okay. Okay! I’m better now. That actually helped.")]},
    {l:"Show me what you can do.",set:{hubert:"power"},fx:{stat:{might:1,wits:1}},n:[
      NAR("Hubert glowed. For one second, he was bright gold. Then he sneezed and went back to tin."),
      L("hubert","s","That was more than I’ve done in years!")]},
    {l:"Gold or tin, you’re Hubert.",set:{hubert:"tin"},fx:{stat:{charm:1,grit:1}},n:[
      L("hubert","h","That’s the nicest thing anyone has said to a hat.")]}
  ]},
  L("hubert","m","Let’s go be legends."),
  {fx:{seal:1,xpA:200}}
 ]},

{id:"c13",act:5,title:"The Empress of Ledgers",bg:"ledger",
 req:()=>rankIdx()>=6&&S.ch.c12,reqText:"Reach Empire rank",

  L("quill","n","So this is the kingdom that doesn’t add up."),

  {ch:[

    {l:"“We can count some things. Not everything.”",set:{quillAns:"some"},n:[L("quill","s","...Some things."),L("quill","a","No. Not good enough.")]},
    {l:"“HONK.”",set:{quillAns:"honk"},n:[L("doug","h","HONK!"),L("quill","a","Do NOT make me count that.")]}
  ]},
  L("quill","a","At the next full ledger, the Great Audit begins. Everything unaccounted for will be removed."),
  NAR("She vanished in a puff of rubber stamps."),
  L("hubert","w","We have until the next full ledger. That means... a few more levels."),
  L("brun","a","I can wait. I’ve been training for this since Monday.")

/* ================= PORTRAITS (inline SVG, mood-driven) ================= */
const INK="#2a1d4d",BROW="#3b2a1d";
function eyes(m,x1,x2,y,r,skin){
  const one=(x,side)=>{
    if(m==="h")return `<path d="M${x-r} ${y+2} Q${x} ${y-r*1.5} ${x+r} ${y+2}" stroke="${INK}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
    const rr=m==="s"?r*1.35:r;
    let o=`<ellipse cx="${x}" cy="${y}" rx="${rr}" ry="${rr*1.12}" fill="#fff" stroke="${INK}" stroke-width="1.6"/>`;
    const px=m==="w"?x-side*1.8:x,py=m==="d"?y+2.5:m==="w"?y+1:y,pr=m==="s"?rr*0.3:rr*0.52;
    o+=`<circle cx="${px}" cy="${py}" r="${pr}" fill="${INK}"/><circle cx="${px-pr*0.3}" cy="${py-pr*0.3}" r="${pr*0.3}" fill="#fff"/>`;
    if(m==="m")o+=`<path d="M${x-rr-2} ${y-rr*0.1} A${rr+2} ${rr*1.1} 0 0 1 ${x+rr+2} ${y-rr*0.1} Z" fill="${skin}" stroke="${INK}" stroke-width="1.6"/>`;
    return o;
  };
  const brow=(x,side)=>{
    let d;
    if(m==="a")d=`M${x-side*(r+3)} ${y-r-9} L${x+side*(r+2)} ${y-r-1}`;
    else if(m==="d"||m==="w")d=`M${x-side*(r+3)} ${y-r-2} L${x+side*(r+2)} ${y-r-9}`;
    else if(m==="s")d=`M${x-r-2} ${y-r*1.35-7} Q${x} ${y-r*1.35-12} ${x+r+2} ${y-r*1.35-7}`;
    else if(m==="m")d=side<0?`M${x-r-2} ${y-r-7} L${x+r+2} ${y-r-7}`:`M${x-r-2} ${y-r-6} Q${x} ${y-r-14} ${x+r+2} ${y-r-8}`;
    else if(m==="h")d=`M${x-r-2} ${y-r-6} Q${x} ${y-r-10} ${x+r+2} ${y-r-6}`;
    else d=`M${x-r-2} ${y-r-6} L${x+r+2} ${y-r-6}`;
    return `<path d="${d}" stroke="${BROW}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  };
  return one(x1,-1)+one(x2,1)+brow(x1,-1)+brow(x2,1);
}
function mouth(m,x,y,w){
  const sw=`stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"`;
  if(m==="h")return `<path d="M${x-w} ${y-2} Q${x} ${y+w*1.1} ${x+w} ${y-2} Z" fill="${INK}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M${x-w*0.55} ${y+w*0.45} Q${x} ${y+w*0.25} ${x+w*0.55} ${y+w*0.45}" fill="#ff7a88"/>`;
  if(m==="s")return `<ellipse cx="${x}" cy="${y+3}" rx="${w*0.4}" ry="${w*0.55}" fill="${INK}"/>`;
  if(m==="a")return `<path d="M${x-w} ${y+4} Q${x} ${y-5} ${x+w} ${y+4}" ${sw}/>`;
  if(m==="m")return `<path d="M${x-w} ${y+2} Q${x+2} ${y+6} ${x+w} ${y-4}" ${sw}/>`;
  if(m==="d")return `<path d="M${x-w*0.8} ${y+4} Q${x} ${y-3} ${x+w*0.8} ${y+4}" ${sw}/>`;
  if(m==="w")return `<path d="M${x-w} ${y} Q${x-w/2} ${y-4} ${x} ${y} Q${x+w/2} ${y+4} ${x+w} ${y}" ${sw}/>`;
  return `<path d="M${x-w} ${y} Q${x} ${y+5} ${x+w} ${y}" ${sw}/>`;
}

/* ================= AUDIO (WebAudio synth, no files) ================= */
const AU={ctx:null,master:null,mbus:null,sfxOn:true,musicOn:true,mode:"kingdom",timer:null,step:0,next:0,noise:null};
const NOTE=n=>440*Math.pow(2,(n-69)/12);
function auInit(){
  if(AU.ctx){if(AU.ctx.state==="suspended")AU.ctx.resume().catch(()=>{});return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AU.ctx=new C();
    AU.master=AU.ctx.createGain();AU.master.gain.value=0.75;AU.master.connect(AU.ctx.destination);
    AU.mbus=AU.ctx.createGain();AU.mbus.gain.value=0.22;AU.mbus.connect(AU.master);
    const len=AU.ctx.sampleRate*0.4,buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;
    auMusicStart();
  }catch(e){AU.ctx=null;}
}
function tone(f,dur,type,vol,delay,slideTo,bus){
  if(!AU.ctx)return;
  const c=AU.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(bus||AU.master);o.start(t);o.stop(t+dur+0.05);
}
function burst(dur,vol,lp,delay){
  if(!AU.ctx||!AU.noise)return;
  const c=AU.ctx,t=c.currentTime+(delay||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;f.type="lowpass";f.frequency.value=lp||1800;
  g.gain.setValueAtTime(vol||0.25,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+dur+0.02);
}
function sfx(n){
  if(!AU.ctx||!AU.sfxOn)return;
  const r=Math.random();
  switch(n){
    case"tap":tone(520+r*160,0.09,"triangle",0.16);tone(780+r*200,0.07,"sine",0.08,0.02);break;
    case"crit":tone(660,0.1,"square",0.12);tone(990,0.14,"triangle",0.16,0.05);tone(1320,0.2,"sine",0.14,0.1);break;
    case"coin":tone(988,0.07,"square",0.08);tone(1319,0.2,"square",0.08,0.07);break;
    case"build":tone(110,0.18,"sawtooth",0.18,0,60);burst(0.1,0.15,900);tone(660,0.15,"triangle",0.1,0.12);tone(880,0.2,"triangle",0.1,0.2);break;
    case"ui":tone(440,0.05,"triangle",0.07);break;
    case"nav":tone(330,0.05,"sine",0.08);tone(494,0.06,"sine",0.06,0.04);break;
    case"err":tone(150,0.18,"sawtooth",0.1,0,100);break;
    case"level":[523,659,784,1047].forEach((f,i)=>tone(f,0.22,"triangle",0.16,i*0.08));tone(1568,0.4,"sine",0.1,0.34);break;
    case"rank":[392,523,659,784,1047].forEach((f,i)=>tone(f,0.3,"square",0.09,i*0.1));[523,659,784,1047].forEach(f=>tone(f,0.9,"triangle",0.12,0.55));break;
    case"win":[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.2,"triangle",0.15,i*0.07));break;
    case"lose":[392,330,262,196].forEach((f,i)=>tone(f,0.28,"triangle",0.15,i*0.14));break;
    case"hit":burst(0.12,0.3,2200);tone(120,0.14,"sawtooth",0.16,0,50);break;
    case"bosshit":burst(0.2,0.4,1400);tone(90,0.25,"sawtooth",0.22,0,40);break;
    case"heal":[523,659,784].forEach((f,i)=>tone(f,0.18,"sine",0.12,i*0.07));break;
    case"honk":tone(420,0.28,"sawtooth",0.16,0,260);tone(425,0.24,"square",0.06,0.02,270);break;
    case"goose":tone(700,0.1,"square",0.1);tone(900,0.1,"square",0.1,0.08);tone(1200,0.28,"triangle",0.14,0.16);break;
    case"chapter":[196,247,294,392].forEach(f=>tone(f,1.4,"triangle",0.1));tone(784,0.8,"sine",0.1,0.3);break;
    case"seal":tone(1319,0.12,"sine",0.14);tone(1760,0.3,"sine",0.12,0.1);break;
    case"type":tone(900+r*300,0.02,"square",0.025);break;
    case"gift":[659,784,988,1319].forEach((f,i)=>tone(f,0.14,"triangle",0.12,i*0.06));break;
    case"drop":tone(1047,0.1,"sine",0.12);tone(1568,0.25,"sine",0.14,0.09);break;
  }
}

function auMusicStart(){
  if(AU.timer)return;

function auSched(){
  const c=AU.ctx;if(!c)return;
  if(!AU.musicOn||document.hidden){AU.next=Math.max(AU.next,c.currentTime+0.1);return;}
  const m=MODES[AU.mode]||MODES.kingdom,spb=60/m.bpm/2;
  while(AU.next<c.currentTime+0.4){
    const st=AU.step,bar=Math.floor(st/8)%m.prog.length,chord=m.prog[bar],delay=AU.next-c.currentTime;
    if(st%8===0)tone(NOTE(chord[0]-12),spb*7,"triangle",0.5,delay,null,AU.mbus);
    if(st%2===0&&AU.mode!=="story"||st%4===0){tone(NOTE(chord[1][(st/2|0)%3]),spb*1.6,"sine",0.28,delay,null,AU.mbus);}
    if(Math.random()<m.lead&&st%2===0){const n=m.scale[Math.floor(Math.random()*m.scale.length)];tone(NOTE(n+12),spb*1.4,"triangle",0.16,delay,null,AU.mbus);}
    if(AU.mode==="battle"&&st%4===2)burst(0.05,0.07,3800,delay);

  $("#decreeAmt").textContent="+"+fmt(D.decree*(on?3:1))+" coin · tap tap tap";
  $("#decree").classList.toggle("frenzy",on);
  $("#decreeT").textContent=on?"FRENZY! x3":"Issue Royal Decree";
  $("#fzFill").style.width=(on?clamp(f.t/10*100,0,100):f.m)+"%";
  $("#fzL").textContent=on?"Decree Frenzy!":"Decree Frenzy";
  $("#fzR").textContent=on?Math.ceil(f.t)+"s":Math.floor(f.m)+"%";
  const t=$("#petTimer");if(t)t.textContent=Math.max(1,Math.ceil(S.pn))+"s";
  const g=GOALS[S.goal];
  if(g&&g.pr){const p=g.pr();const e=$("#goalBar");if(e)e.style.width=clamp(p[0]/p[1]*100,0,100)+"%";const n=$("#goalNum");if(n)n.textContent=Math.min(p[0],p[1])+" / "+p[1];}

function renderLog(){
  const el=$("#gaz");if(!el)return;

function renderPet(){
  const box=$("#petBox");let h="";
  if(U.petRes){
    const r=U.petRes;
    h='<div class="card pet"><div class="eyebrow">'+esc(r.title)+'</div>'+(r.v?'<div class="verdict '+(r.v==="w"?"w":"l")+'">'+(r.v==="w"?"It worked!":"It did not work.")+'</div>':'')+'<p style="margin-top:4px">'+T(r.x)+'</p><div class="fxs">'+effHTML(r.o)+'</div><button class="btn" id="petNext">'+(S.pq.length?"Next petition":"Back to the throne")+'</button></div>';
  }else if(S.pq.length){
    const p=petById(S.pq[0]);
    if(!p){S.pq.shift();return renderPet();}
    h='<div class="card pet"><div class="eyebrow">Petition'+(S.pq.length>1?" · "+(S.pq.length-1)+" more waiting":"")+'</div><h3>'+p.t+'</h3><p class="muted" style="font-weight:700">'+T(p.x)+'</p><div class="choices">'+
      p.c.map((c,i)=>'<button class="choice" data-ch="'+i+'"><span class="cl">'+T(c.l)+'</span>'+(c.k?'<span class="ck">'+STAT_NAMES[c.k.s]+' · '+Math.round(chance(c.k)*100)+'%</span>':'')+'</button>').join("")+'</div></div>';
  }else{
    h='<div class="card pet"><div class="eyebrow">Petitions</div><p class="muted">The court is quiet. Next petition in <b id="petTimer" style="color:var(--fg)"></b>.</p></div>';
  }
  box.innerHTML=h;updateThrone();updateBadges();
}
function choosePet(i){
  const p=petById(S.pq[0]);if(!p)return;
  const c=p.c[i];if(!c)return;
  let ok=true;
  if(c.k)ok=Math.random()<chance(c.k);
  const res=ok?c.w:(c.f||c.w);
  const o=applyFx(res.fx||{});
  S.pq.shift();S.pet++;
  U.petRes={title:p.t,x:res.x,o,v:c.k?(ok?"w":"l"):""};
  addLog(p.t+": "+(c.k?(ok?"it worked.":"it didn't work."):"settled."));
  sfx(c.k?(ok?"win":"err"):"ui");
  renderPet();
}
function onDecree(e){
  auInit();
  const r=doDecree();
  const w=$("#decreeWrap"),rc=w.getBoundingClientRect();
  const x=e&&e.clientX?e.clientX-rc.left:rc.width/2,y=e&&e.clientY?e.clientY-rc.top:rc.height/2;
  const p=document.createElement("div");p.className="pop"+(r.crit?" crit":"");p.textContent=(r.crit?"CRIT! ":"")+"+"+fmt(r.v);
  p.style.left=clamp(x,40,rc.width-40)+"px";p.style.top=(y-20)+"px";w.appendChild(p);
  if(w.querySelectorAll(".pop").length>8)w.removeChild(w.querySelector(".pop"));
  setTimeout(()=>{if(p.parentNode)p.parentNode.removeChild(p);},900);
  sfx(r.crit?"crit":"tap");vib(r.crit?[10,20,10]:6);
  scCoins(r.crit?5:1);
  if(r.started){toast("DECREE FRENZY! Triple coin for 8 seconds!","good");say("FRENZY! Tap tap tap tap tap!","s");sfx("level");scBurst(280,140,30,"#ff4fa3");}
  else if(r.crit&&Math.random()<0.4)say(pick(["CRITICAL DECREE! The people gasp!","That decree had sparkles. I saw sparkles.","A perfect decree. Frame it. Don't frame me."]),"h");
  else if(S.tapped===25)say("Twenty-five decrees! Your wrist is a legend. Your voice isn't, but we'll work on it.","h");
  else if(S.tapped===100)say("One hundred decrees. {n}, you've decreed more than a small dragon.","m");
  updateThrone();
}
function onAction(id){
  const r=doAction(id);
  if(!r){sfx("err");return;}
  if(r.err){toast(r.err,"bad");sfx("err");return;}
  sfx(id==="feast"?"heal":"coin");vib(10);
  toast(r.a.n+"! "+effHTML(r.o),"good");
  if(id==="feast"){scBurst(280,150,24,"#ff9fcb");say("Feast time! The people love a feast. And free turnips.","h");}
  updateActs();
}

/* ---------- realm ---------- */
function effText(b){
  const f=b.fx,p=[];
  if(f.coin)p.push("+"+fmt(f.coin)+" coin/s");
  if(f.grub)p.push("+"+fmt(f.grub)+" grub/s");
  if(f.lumber)p.push("+"+fmt(f.lumber)+" lumber/s");
  if(f.house)p.push("+"+fmt(f.house)+" housing");
  if(f.def)p.push("+"+fmt(f.def)+" defense");
  if(f.vibe)p.push("+"+f.vibe+" vibe goal");
  if(f.renown)p.push("+"+f.renown+" renown/s");
  if(f.stam)p.push("+"+Math.round(f.stam*100)+"% stamina regen");
  if(f.loot)p.push("+"+f.loot+"% loot chance");
  if(f.boss)p.push("+"+Math.round(f.boss*100)+"% boss damage");
  if(f.xps)p.push("passive XP");
  return p.join(" · ")+" each";
}
function renderRealm(){
  const r=rankIdx();U.realmRank=r;
  const vis=B.filter(b=>b.rk<=r),next=B.find(b=>b.rk>r);
  let h="";
  vis.forEach(b=>{
    h+='<div class="bcard" data-b="'+b.id+'"><div class="bt"><b>'+b.n+'</b><span class="own"></span></div><div class="beff">'+effText(b)+'</div><div class="bd">'+b.d+'</div><div class="bb"><div class="cost"></div><button class="btn sm buy" data-buy="'+b.id+'">Build</button></div></div>';
  });
  if(next)h+='<div class="bcard locked"><div class="bt"><b>'+next.n+'</b></div><div class="bd">Unlocks at '+RANKS[next.rk].n+' rank ('+fmt(RANKS[next.rk].r)+' renown).</div></div>';
  $("#bList").innerHTML=h;
  $("#realmSum").innerHTML='<div class="sumrow" id="sumRow"></div><div class="qty" id="qty">'+[1,5,25,"max"].map(q=>'<button data-q="'+q+'">'+(q==="max"?"Max":"×"+q)+'</button>').join("")+'</div>';
  updateBuildings();
}
function updateBuildings(){
  if(U.realmRank!==rankIdx()){renderRealm();return;}

   '<div>Subjects<b>'+fmt(Math.floor(S.subj))+'/'+fmt(D.house)+'</b></div>'+

   '<div>Defense<b>'+fmt(D.def)+'</b></div>';

function onBuy(id){

function onQuest(id){

function typeStart(full,cls){

function nextNode(){
  while(ST.stack.length){
    const f=ST.stack[ST.stack.length-1];
    if(f.i>=f.a.length){ST.stack.pop();continue;}
    return f.a[f.i++];
  }
  return null;
}
function playChapter(c,rep){
  auInit();
  ST.c=c;ST.rep=!!rep;ST.stack=[{a:c.scene,i:0}];ST.L=null;ST.R=null;ST.mood={};ST.skip=false;ST.choosing=false;ST.advance=null;

  $("#dlgText").textContent="";$("#dlgName").textContent="";$("#dlgChoices").innerHTML="";$("#dlgMore").hidden=true;
  setBg(c.bg||"village");paintCast();

function actCard(n,done){
  const a=ACTS[n-1],el=document.createElement("div");el.className="actcard";
  el.innerHTML='<div class="a1">ACT '+ROM[n]+'</div><div class="line"></div><h2>'+a.n+'</h2><p>'+a.sub+'</p>';
  $("#story").appendChild(el);

  el.addEventListener("click",go);setTimeout(go,3400);

function stepStory(){
  const n=nextNode();
  if(!n)return endChapter(true);
  if(n.bg){setBg(n.bg);return stepStory();}
  if(n.set){if(!ST.rep)Object.assign(S.flags,n.set);return stepStory();}
  if(n.ifFlag){ST.stack.push({a:(S.flags[n.ifFlag]===n.is)?n.yes:n.no,i:0});return stepStory();}
  if(n.join){ST.skip=false;return showJoin(n.join);}
  if(n.fx){if(ST.rep)return stepStory();ST.skip=false;return showReward(applyFx(n.fx));}
  if(n.boss){
    if(ST.rep)return stepStory();
    ST.skip=false;
    return startFight(n.boss,win=>{if(win)stepStory();else endChapter(false);});
  }
  if(n.ch){ST.skip=false;return showChoices(n);}
  showLine(n);
}

  const sp=n.w,tx=$("#dlgText");

function resolveChoice(i){
  const o=ST.curCh.ch[i];if(!o)return;
  ST.choosing=false;$("#dlgChoices").innerHTML="";
  sfx("ui");
  let frame=o.n||[];
  if(!ST.rep){
    if(o.set)Object.assign(S.flags,o.set);
    if(o.fx){const r=applyFx(o.fx);if(r.length)toast(effHTML(r),"good");}
  }
  if(o.k){
    const ok=ST.rep?true:Math.random()<chance(o.k);
    frame=(ok?o.w:o.f)||[];
    if(!ST.rep&&ok&&o.setW)Object.assign(S.flags,o.setW);
    frame=[{w:"chk",t:STAT_NAMES[o.k.s]+" check: "+(ok?"Success!":"Not quite.")}].concat(frame);
    sfx(ok?"win":"err");
  }
  ST.stack.push({a:frame,i:0});
  stepStory();
}
function endChapter(done){

  $("#story").hidden=true;auMode("kingdom");
  const actc=$("#story .actcard");if(actc&&actc.parentNode)actc.parentNode.removeChild(actc);

}

}
function startGame(){
  const n=($("#inName").value||"").trim(),r=($("#inRealm").value||"").trim();
  S.hero=n||"Majesty";S.realm=r||"Lower Mudwick";S.intro=1;
  $("#title").hidden=true;save();auInit();applySettings();
  renderAll();
  playChapter(CHAPTERS[0],false);
}
function maybeDaily(){
  const p=dailyPending();if(!p)return;
  const row='<div class="row" style="justify-content:center;gap:6px">'+DAILY.map((g,i)=>'<span class="fx '+(i===(p.streak-1)%7?'up':'')+'" style="'+(i===(p.streak-1)%7?'background:#1d4a30':'')+'">'+(i+1)+'</span>').join("")+'</div>';
  banner("Daily Royal Gift","Day <b>"+p.streak+"</b> of your streak. Today: <b>"+p.gift.t+"</b>.",row,"Claim gift",()=>{
    const o=dailyClaim(p);sfx("gift");toast("Daily gift! "+effHTML(o),"good");save();
  });
}
function offlineReturn(dt){
  const r=offlineSim(dt);
  const h=Math.floor(dt/3600),m=Math.floor((dt%3600)/60),away=(h?h+"h ":"")+m+"m";
  const chips=[{v:r.coin,label:"coin"},{v:r.lumber,label:"lumber"},{v:r.subj,label:"subjects"}].filter(x=>x.v!==0);
  banner("Welcome back!","You were gone "+away+". Your realm kept going at "+Math.round(D.offEff*100)+"% speed"+(D.offEff<0.8?" (the Sweet Dreams edict makes this better)":"")+".",
    '<div class="fxs" style="justify-content:center">'+effHTML(chips)+'<span class="fx up">Stamina full</span>'+(r.lvl?'<span class="fx up">+'+r.lvl+' level'+(r.lvl>1?"s":"")+'</span>':"")+'</div>');
}

/* ---------- settings ---------- */
function applySettings(){AU.sfxOn=!!S.set.sfx;AU.musicOn=!!S.set.music;}
function setBtn(k){S.set[k]=S.set[k]?0:1;applySettings();if(k!=="vib"&&S.set[k])auInit();sfx("ui");renderHero();ui();}

/* ---------- nav / render ---------- */
function moveScene(to){
  const box=$("#sceneBox"),slot=to==="realm"?$("#sceneSlotR"):$("#sceneSlotT");
  if(box.parentNode!==slot)slot.appendChild(box);
}
function show(t){
  U.tab=t;U.confirm="";U.imp="";
  $$(".tab").forEach(s=>s.hidden=s.id!=="tab-"+t);
  $$("#nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===t)));
  if(t==="throne"||t==="realm")moveScene(t);
  if(t==="throne"){renderQuestCard();renderActs();renderGoal();renderPet();renderLog();}
  if(t==="realm")renderRealm();
  if(t==="court")renderCourt();
  if(t==="quests"){renderQuests();renderQRes();}
  if(t==="hero")renderHero();
  updateBadges();
  window.scrollTo(0,0);
}
function renderAll(){show(U.tab);ui();}

/* ---------- events ---------- */
function bind(){
  document.addEventListener("pointerdown",()=>{auInit();},{once:false,passive:true});
  $("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b){sfx("nav");show(b.dataset.tab);}});
  $("#decree").addEventListener("click",onDecree);
  $("#muteBtn").addEventListener("click",()=>{const on=!(S.set.sfx||S.set.music);S.set.sfx=on?1:0;S.set.music=on?1:0;applySettings();if(on)auInit();ui();if(U.tab==="hero")renderHero();});
  $("#tab-throne").addEventListener("click",e=>{
    if(e.target.closest("#beginCh")){const c=chapterNext();if(c&&chapterReady(c))playChapter(c,false);return;}
    const a=e.target.closest("[data-act]");if(a){onAction(a.dataset.act);return;}
  });
  $("#petBox").addEventListener("click",e=>{
    const c=e.target.closest("[data-ch]");
    if(c){choosePet(+c.dataset.ch);return;}
    if(e.target.closest("#petNext")){sfx("ui");U.petRes=null;renderPet();}
  });
  $("#tab-realm").addEventListener("click",e=>{
    const q=e.target.closest("[data-q]");
    if(q&&q.closest("#qty")){S.qty=q.dataset.q==="max"?"max":+q.dataset.q;sfx("ui");updateBuildings();return;}
    const b=e.target.closest("[data-buy]");if(b)onBuy(b.dataset.buy);
  });
  $("#tab-court").addEventListener("click",e=>{
    const b=e.target.closest("[data-bond]");
    if(b){const line=bondUp(b.dataset.bond);if(line){sfx("gift");toast("<b>"+esc(COMP[b.dataset.bond].n)+" bond "+S.comp[b.dataset.bond]+"</b><br>"+esc(line),"good");scBurst(280,150,20,"#ff9fcb");addLog(COMP[b.dataset.bond].n+" grew closer to you.");renderCourt();ui();}return;}
    const d=e.target.closest("[data-ed]");
    if(d){if(edictBuy(d.dataset.ed)){sfx("seal");const x=EDICTS.find(z=>z.id===d.dataset.ed);toast("Edict signed: "+x.n,"good");say("A new edict! I love official-looking papers. They smell like power.","h");renderCourt();ui();}else sfx("err");return;}
    const r=e.target.closest("[data-replay]");
    if(r){const c=CHAPTERS.find(x=>x.id===r.dataset.replay);if(c)playChapter(c,true);}
  });
  $("#tab-quests").addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)onQuest(g.dataset.go);});
  $("#tab-hero").addEventListener("click",e=>{
    const st=e.target.closest("[data-st]");if(st){if(S.pts>0){S.st[st.dataset.st]++;S.pts--;refresh();sfx("ui");renderHero();ui();}return;}
    const eq=e.target.closest("[data-eq]");if(eq){const i=S.bag.findIndex(x=>x.id===eq.dataset.eq);if(i>=0){const it=S.bag[i],cur=S.gear[it.s];S.bag.splice(i,1);if(cur)S.bag.push(cur);S.gear[it.s]=it;refresh();sfx("ui");renderHero();ui();}return;}
    const sl=e.target.closest("[data-sell]");if(sl){const i=S.bag.findIndex(x=>x.id===sl.dataset.sell);if(i>=0){const v=sellVal(S.bag[i]);S.coin+=v;S.earn+=v;S.bag.splice(i,1);sfx("coin");renderHero();}return;}
    const sw=e.target.closest("[data-set]");if(sw){setBtn(sw.dataset.set);return;}
    if(e.target.closest("#sellWeak")){sellWeak();return;}
    if(e.target.closest("#saveBtn")){save();toast("Saved!","good");return;}
    if(e.target.closest("#expBtn")){
      const code=exportCode();
      const done=ok=>{toast(ok?"Save code copied!":"Copy the code from the box below.","good");if(!ok){U.imp="out";renderHero();}};
      try{navigator.clipboard.writeText(code).then(()=>done(true),()=>done(false));}catch(er){done(false);}
      return;}
    if(e.target.closest("#impBtn")){U.imp="in";renderHero();return;}
    if(e.target.closest("#impGo")){const ok=importCode(($("#impBox")||{}).value||"");toast(ok?"Save loaded!":"That code didn't work.",ok?"good":"bad");if(ok){U.imp="";crownColor();U.realmRank=-1;U.questLvl=-1;applySettings();renderAll();}return;}
    if(e.target.closest("#abdBtn")){
      if(U.confirm==="abd"){
        const gain=abdicate();U.confirm="";U.petRes=null;U.qres=null;U.realmRank=-1;U.questLvl=-1;crownColor();
        banner("A new heir!","You abdicated and ran off to tend turnips. A new dynasty begins with <b>+"+gain+" Legacy</b>. Everything you earn is now +"+S.legacy*8+"% bigger.");
        say("Dynasty "+S.dynasty+"! Same crown. Same hat. New attitude.","h");confetti(50);sfx("rank");renderAll();
      }else{U.confirm="abd";renderHero();}
      return;}
    if(e.target.closest("#resetBtn")){
      if(U.confirm==="reset"){
        try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(OLD_KEY);}catch(er){}
        S=fresh();refresh();U.confirm="";U.petRes=null;U.qres=null;U.realmRank=-1;U.questLvl=-1;crownColor();renderAll();showTitle();
      }else{U.confirm="reset";renderHero();}
      return;}
  });
  $("#banner").addEventListener("click",e=>{
    if(e.target.closest("#bnOk")||e.target.id==="banner"){
      const b=U.curBn;if(b&&b.onOk){const f=b.onOk;b.onOk=null;f();}
      sfx("ui");nextBanner();
    }
  });
  $("#titleIn").addEventListener("click",e=>{if(e.target.closest("#inGo"))startGame();});
  $("#dlg").addEventListener("click",e=>{
    const ch=e.target.closest("[data-o]");
    if(ch){resolveChoice(+ch.dataset.o);return;}
    dlgTap();
  });
  document.addEventListener("keydown",e=>{
    if(!$("#story").hidden&&(e.key===" "||e.key==="Enter")&&!e.target.closest("button")){e.preventDefault();dlgTap();}
  });
  $("#stSkip").addEventListener("click",()=>{
    if(ST.choosing)return;
    ST.skip=true;clearInterval(ST.tm);
    const a=$("#story .actcard");if(a)a.click();
    else if(ST.advance||!ST.done){ST.advance=null;ST.done=true;stepStory();}
  });
  $("#fActs").addEventListener("click",e=>{const b=e.target.closest("[data-fa]");if(b&&!b.disabled)fAct(b.dataset.fa);});
  $("#fComp").addEventListener("click",e=>{const b=e.target.closest("[data-fa]");if(b&&!b.disabled)fAct(b.dataset.fa);});
  $("#fight").addEventListener("click",e=>{
    const f=U.fight;if(!f)return;
    if(e.target.closest("#fWin")){const r=$("#fight .fRes");if(r)r.remove();$("#fight").hidden=true;$("#fBoss").classList.remove("dead");auMode("story");const cb=f.cb;U.fight=null;if(cb)cb(true);}
    if(e.target.closest("#fRetry")){const r=$("#fight .fRes");if(r)r.remove();startFight(f.bid,f.cb);}
    if(e.target.closest("#fFlee")){const r=$("#fight .fRes");if(r)r.remove();$("#fight").hidden=true;auMode("story");const cb=f.cb;U.fight=null;if(cb)cb(false);}
  });
  document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
  window.addEventListener("pagehide",save);
}

/* ---------- loop ---------- */
function tick(){
  const now=Date.now();
  let dt=(now-S.last)/1000;S.last=now;
  if(dt<0)dt=0;
  if(dt>6)offlineReturn(dt);else step(dt);
  tick.n=(tick.n||0)+1;
  if(tick.n%4===0)slow();
  ui();
}
function slow(){
  checkProgress();
  if(U.qsig!==questSig()&&U.tab==="throne")renderQuestCard();
  if(U.tab==="court"&&U.courtSig!==courtSig())renderCourt();
  if(Date.now()-U.sayAt>26000)say(idleQuip(),pick(["n","h","m","n"]));
  if(tick.n%20===0)save();
}
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  tweenNums(now);
  if((U.tab==="throne"||U.tab==="realm")&&$("#story").hidden&&$("#fight").hidden&&$("#title").hidden)scFrame(now);
}

/* ---------- boot ---------- */
function boot(data){
  let d=null;
  if(data&&data.S&&(data.S.v===2||data.S.v===1))d=data.S;
  else{
    try{
      const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem(OLD_KEY);
      if(raw)d=JSON.parse(raw);
    }catch(e){}
  }
  load(d);refresh();
  applySettings();
  bind();
  scInit($("#scene"));
  SC.gooseCb=()=>{
    const t=gooseReward();
    toast("Golden Goose! "+t,"good");sfx("goose");vib([20,30,20]);
    say(pick(["GOT HIM! That goose owed us money.","Golden Goose! Doug is furious.","Honk honk! That's a lot of gold for a bird."]),"h");
    checkProgress();
  };
  SC.tapCb=()=>{sfx("ui");};
  crownColor();
  S.rk=rankIdx();
  const hadSave=!!S.intro&&!!S.ch.c1;
  renderAll();
  say(hadSave?"Back already, {n}? The kingdom didn't fall apart. Mostly.":"Psst. Over here. I'm the crown.",hadSave?"h":"m");
  if(!hadSave)showTitle();
  const away=(Date.now()-S.last)/1000;
  if(hadSave&&away>30)offlineReturn(away);
  S.last=Date.now();
  if(hadSave)maybeDaily();
  renderLog();
  setInterval(tick,250);
  setInterval(save,8000);
  requestAnimationFrame(frame);
  try{
    const hot=window.claude&&window.claude.hot;
    if(hot&&hot.snapshot)hot.snapshot(()=>({S}));
  }catch(e){}
}

const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data);

})();
</script>

</body>
</html>
